[build]
command = "./cloudflare-build.sh"
output_directory = ".next"
base_directory = ""

[build.environment]
NODE_VERSION = "18.17.1"
NPM_VERSION = "9.6.7"

[site]
bucket = "./.next"
entry-point = "."

[env.production]
name = "production"
route = "*"

[env.staging]
name = "staging"
route = "staging.*"
